<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produkt Søgning</title>
    <link rel="stylesheet" href="style.css">
</head>

<!---Category ændret til Genre. Pris interval ændret til antal spillere.  Vurdering ændret til sværhedsgrad.  Farve ændret til stemning-->
<body>
    <div class="container">
        <header>
            <h1>SpilKatalog</h1>
        </header>

        <main>
            <div class="search-container">
                <input type="search" id="search-input" placeholder="Søg efter spil..." class="search-input">

                <select id="predefined-search" class="predefined-select">
                    <option value="">---- Sorter efter ----</option>
                    <option value="populaere">Mest populære</option>
                    <option value="pris-stigende">Spillere: Lav til høj</option>
                    <option value="pris-faldende">Spillere: Høj til lav</option>
                </select>

                <button id="filter-toggle" class="filter-button">
                    <span>🔍 Filtrer</span>
                </button>
            </div>

            <div id="filter-panel" class="filter-panel">
                <div class="filter-header">
                    <h2>Filtrer Spil</h2>
                    <button id="close-filter" class="close-button">&times;</button>
                </div>

                <div class="filter-content">
                    <div class="filter-group">
                        <label class="filter-label">Genre</label>
                        <div class="checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Familiespil"> Familiespil
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Quizspil"> Quiz
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Strategi"> Strategi
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Brætspil"> Brætspil
                            </label>
                             <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Paratviden"> Paratviden
                            </label>
                             <label class="checkbox-label">
                                <input type="checkbox" name="category" value="Selskabsspil"> Selskabsspil
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Antal spillere</label>
                        <div class="price-range">
                            <input type="number" id="min-price" placeholder="Min" class="price-input">
                            <span class="price-separator">-</span>
                            <input type="number" id="max-price" placeholder="Max" class="price-input">
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Sværhedsgrad</label>
                        <div class="rating-group">
                            <!-- <label class="rating-label">
                                <input type="radio" name="rating" value="5"> ★★★★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="4"> ★★★★
                            </label> -->
                            <label class="rating-label">
                                <input type="radio" name="rating" value="3"> ★★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="2"> ★★
                            </label>
                            <label class="rating-label">
                                <input type="radio" name="rating" value="1"> ★
                            </label>
                        </div>
                    </div>

                    <div class="filter-group">
                        <label class="filter-label">Stemning</label>
                        <div class="Stemning-group">
                            <label class="Stemning-label">
                                <input type="checkbox" name="Stemning" value="Nostalgi & Hygge"> Nostalgi & Hygge 
                            </label>
                            <label class="Stemning-label">
                                <input type="checkbox" name="Stemning" value="Drilsk & Konkurrence"> Drilsk & Konkurrence
                            </label>
                            <label class="Stemning-label">
                                <input type="checkbox" name="Stemning" value="Fest & Latter"> Fest & Latter
                            </label>
                            <label class="Stemning-label">
                                <input type="checkbox" name="Stemning" value="Intens & Taktisk Strategi"> Intens & Taktisk Strategi
                            </label>
                            <label class="Stemning-label">
                                <input type="checkbox" name="Stemning" value="Tænksom & Agentstemning"> Tænksom & Agentstemning
                            </label>
                        </div>
                    </div>
                </div>

                <div class="filter-footer">
                    <button id="apply-filters" class="apply-button">Vis Spil</button>
                </div>
            </div>

            <div id="products-container" class="products-container">
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Produkt Katalog</p>
        </footer>
    </div>

    <dialog id="product-dialog">
        <article class="dialog-content">
            <img id="dialog-image" src="" alt="" class="product-image">
            <h2 id="dialog-title"></h2>
            <p id="dialog-description"></p>
            <div class="product-meta">
                <span id="dialog-price" class="product-price"></span>
                <span id="dialog-category" class="product-category"></span>
            </div>
            <div id="dialog-rating" class="product-rating"></div>
            <menu class="dialog-actions">
                <button id="dialog-close" value="cancel">Luk</button>
            </menu>
        </article>
    </dialog>

    <div id="overlay" class="overlay"></div>
    <script src="data.js"></script>
    <script src="scriptui.js"></script>
    <script src="scriptfilt.js"></script>
</body>

</html>
